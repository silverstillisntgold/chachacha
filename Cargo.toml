[package]
name = "chachacha"
version = "0.5.0"
edition = "2024"
description = "SIMD optimized implementations of the Chacha stream cipher"
documentation = "https://docs.rs/chachacha"
repository = "https://github.com/silverstillisntgold/chachacha"
categories = ["algorithms", "cryptography", "no-std"]
keywords = ["chacha", "cipher", "simd"]
license = "MIT"
rust-version = "1.95"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dev-dependencies]
getrandom = "0.4.3"
chacha20 = {
    version = "0.10.1",
    default-features = false,
    features = ["rng"],
}
rand_chacha = "0.10.0"
chachacha_042 = {
    package = "chachacha",
    version = "0.4.2",
}
rand = "0.10.0"

[features]
_internal = [] # Exposes custom (non-standard) round counts.
