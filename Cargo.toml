[package]
name = "chachacha"
version = "0.5.3"
edition = "2024"
rust-version = "1.95"
description = "SIMD optimized implementations of the Chacha stream cipher"
documentation = "https://docs.rs/chachacha"
repository = "https://github.com/silverstillisntgold/chachacha"
license = "MIT"
keywords = ["chacha", "cipher", "simd"]
categories = ["algorithms", "cryptography", "no-std"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dev-dependencies]
chacha20 = {
  version = "0.10",
  default-features = false,
  features = ["rng"],
}
chachacha_042 = {
  package = "chachacha",
  version = "0.4",
}
getrandom = "0.4"
rand = "0.10"
rand_chacha = "0.10"

[features]
_internal = []  # UNSTABLE: Exposes custom (non-standard) round counts.
